[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redbears-research"
version = "0.1.0"
description = "Bounded Token Factory and Tavily security research demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
cookbook = ["deepagents", "langchain-nebius", "langchain-tavily"]

[tool.setuptools.packages.find]
include = ["redbears_research*"]

[tool.setuptools.package-data]
redbears_research = ["static/*"]
