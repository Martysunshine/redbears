title: Suspicious PowerShell Encoded Command Execution
id: 7f4a1c3b-9e2d-4f5a-b8c1-3d2e6a7f0b9c
status: experimental
description: >
  Detects PowerShell execution using the -EncodedCommand flag, which is commonly
  used by attackers to obfuscate malicious scripts and evade command-line inspection.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: SOC Copilot Workbench
date: 2024/01/15
modified: 2024/03/01
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-ec '
  condition: selection
falsepositives:
  - Legitimate administrative scripts that use encoded commands for compatibility
  - Software installers that pass encoded arguments to PowerShell
level: high
